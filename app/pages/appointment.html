<main class="main">
  <section class="appointment">
    <div class="container">
      <h2 class="appointment__title">BOOK AN APPOINTMENT</h2>
      <div class="appointment__inner">
        <div class="appointment__content">
          <p class="appointment__content-title">CONTACT INFORMATHION</p>
          <p class="appointment__content-text">Fill in your contact details</p>
          <form class="appointment__form" action="">
            <input class="appointment__input" type="text" placeholder="First name">
            <input class="appointment__input" type="text" placeholder="Last name">
            <input class="appointment__input" type="email" placeholder="Email">
            <input class="appointment__input" type="tel" placeholder="Mobile">
          </form>
          <botton class="appointment__btn" type="submit">
            SEND
          </botton>
        </div>
          <picture>
            <source srcset="images/appointment-img.avif" type="image/avif">
            <source srcset="images/appointment-img.webp" type="image/webp">
            <img class="appointment__img" src="images/appointment-img.jpg" alt="Alt text">
          </picture>
      </div>
    </div>
  </section>
</main>
